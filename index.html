<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG - PAUL OFFICIAL</title>
<link rel="manifest" href="/Paul-app/manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
.header{background:#111;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-circle{width:42px;height:42px;background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.verified{width:20px;height:20px;background:#1DA1F2;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.official{background:#FFD700;color:#000;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:900}
.profile-card,.post-box,.post-card{background:#1a1a1a;margin:12px;border-radius:16px;padding:15px;border:1px solid #333}
.avatar{width:56px;height:56px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:24px}
textarea{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:12px;padding:12px;min-height:80px}
.btn-gold{background:#FFD700;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.btn-outline{border:1px solid #444;background:#000;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer}
.post-img{width:100%;max-height:500px;object-fit:cover;display:block}
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:10px;display:none;border:2px solid #FFD700}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFD700;color:#000;padding:10px 20px;border-radius:20px;font-weight:700;display:none;z-index:999}
</style>
</head>
<body>
<div class="header"><div class="logo"><div class="logo-circle">92KG</div><span style="font-weight:900">MUST 92KG</span><span class="verified">✓</span></div><div class="official">OFFICIAL</div></div>

<div class="profile-card"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">P</div><div><div style="font-weight:900">Paul 92KG ✓</div><div style="font-size:12px;color:#aaa">MUST • Legs Day Specialist • 92KG</div></div></div></div>

<div class="post-box">
<textarea id="postText" placeholder="Leo 92KG - Unapiga nini? 💪"></textarea>
<img id="preview" class="img-preview">
<div style="display:flex;justify-content:space-between;margin-top:12px"><div style="display:flex;gap:8px"><button class="btn-outline" onclick="document.getElementById('fileInput').click()">📸 Chagua Picha</button><button class="btn-outline" onclick="clearImg()" id="clearBtn" style="display:none">❌ Futa</button></div><button class="btn-gold" onclick="createPost()">TUMA POST 🔥</button></div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)"><div id="compressInfo" style="font-size:11px;color:#FFD700;margin-top:6px;display:none"></div>
</div>

<div id="postsContainer"></div><div id="status"></div>

<script>
let selectedImageData="";let posts=JSON.parse(localStorage.getItem('must92kg_posts')||'[]');
function showStatus(m){let s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3000);}
function handleImage(input){if(input.files&&input.files[0]){let file=input.files[0];document.getElementById('compressInfo').style.display='block';document.getElementById('compressInfo').textContent="⏳ Inapunguza picha: "+(file.size/1024).toFixed(0)+"KB...";let r=new FileReader();r.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement('canvas');let maxW=800;let sc=Math.min(1,maxW/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);selectedImageData=c.toDataURL('image/jpeg',0.6);document.getElementById('preview').src=selectedImageData;document.getElementById('preview').style.display='block';document.getElementById('clearBtn').style.display='block';let ns=Math.round(selectedImageData.length*0.75/1024);document.getElementById('compressInfo').textContent="✅ Imebana: "+ns+"KB - Tayari!";showStatus("Picha tayari! ✅");};img.src=e.target.result;};r.readAsDataURL(file);}}
function clearImg(){selectedImageData="";document.getElementById('preview').style.display='none';document.getElementById('fileInput').value="";document.getElementById('clearBtn').style.display='none';document.getElementById('compressInfo').style.display='none';}
function createPost(){let t=document.getElementById('postText').value.trim();if(!t&&!selectedImageData){showStatus("Andika kitu!");return;}let p={id:Date.now(),text:t||"🔥 92KG!",img:selectedImageData,time:new Date().toLocaleString(),likes:0};posts.unshift(p);localStorage.setItem('must92kg_posts',JSON.stringify(posts));document.getElementById('postText').value="";clearImg();renderPosts();showStatus("Post imetumwa! 🔥");}
function renderPosts(){let h="";if(posts.length==0){h='<div class="post-card" style="text-align:center;color:#aaa">Hakuna post bado - Anza sasa! 💪</div>'}else{posts.forEach(p=>{h+=`<div class="post-card"><div style="padding:12px;display:flex;gap:10px"><div class="avatar" style="width:36px;height:36px;font-size:16px">P</div><div><div style="font-weight:700">Paul 92KG ✓</div><div style="font-size:11px;color:#888">${p.time}</div></div></div>${p.text?`<div style="padding:0 12px 12px">${p.text}</div>`:''}${p.img?`<img src="${p.img}" class="post-img">`:''}<div style="padding:10px;display:flex;gap:8px"><button class="btn-outline" onclick="likePost(${p.id})">❤️ Like (${p.likes})</button></div></div>`;});}document.getElementById('postsContainer').innerHTML=h;}
function likePost(id){let p=posts.find(x=>x.id==id);if(p){p.likes++;localStorage.setItem('must92kg_posts',JSON.stringify(posts));renderPosts();}}
renderPosts();
</script>
</body>
</html>
