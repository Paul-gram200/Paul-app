<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG - PAUL PREMIUM</title>
<link rel="manifest" href="/Paul-app/manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#1a1a00 0%,#000 60%);color:#fff;font-family:'Poppins',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#000,#1a1a00);padding:15px;border-bottom:3px solid #FFD700;position:sticky;top:0;z-index:100;box-shadow:0 5px 20px rgba(255,215,0,0.3)}
.header-inner{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo-circle{width:55px;height:55px;background:linear-gradient(135deg,#FFD700,#FF8C00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;color:#000;font-size:16px;border:3px solid #fff;box-shadow:0 0 15px #FFD700;animation:glow 2s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 15px #FFD700}50%{box-shadow:0 0 30px #FFD700,0 0 45px #FFA500}}
.verified{width:22px;height:22px;background:linear-gradient(135deg,#1DA1F2,#00D4FF);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900}
.official{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px;box-shadow:0 0 10px #FFD700}

.stats-card{background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(0,0,0,0.8));border:2px solid #FFD700;border-radius:20px;padding:15px;margin:12px;display:flex;justify-content:space-around;backdrop-filter:blur(10px);box-shadow:0 0 20px rgba(255,215,0,0.2)}
.stat{text-align:center}
.stat-num{font-family:'Orbitron';font-size:22px;font-weight:900;background:linear-gradient(135deg,#FFD700,#FFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:10px;color:#FFD700;letter-spacing:1px}

.post-box{background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:2px solid #333;border-radius:20px;padding:15px;margin:12px;box-shadow:0 5px 15px rgba(0,0,0,0.5)}
.post-box:focus-within{border-color:#FFD700;box-shadow:0 0 20px rgba(255,215,0,0.3)}
textarea,input{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:14px;outline:none}
textarea:focus{border-color:#FFD700}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;border:none;padding:12px 22px;border-radius:25px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,0.4);transition:0.2s}
.btn-gold:active{transform:scale(0.95)}
.btn-outline{border:2px solid #444;background:rgba(0,0,0,0.6);color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;backdrop-filter:blur(5px)}
.btn-outline:hover{border-color:#FFD700;color:#FFD700}

.post-card{background:linear-gradient(135deg,#1e1e1e,#0a0a0a);border:1px solid #333;border-radius:20px;margin:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.6);transition:0.3s}
.post-card:hover{border-color:#FFD700;box-shadow:0 0 25px rgba(255,215,0,0.2)}
.post-head{padding:14px;display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,rgba(255,215,0,0.1),transparent)}
.avatar{width:48px;height:48px;background:linear-gradient(135deg,#FFD700,#FF8C00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:20px;border:2px solid #fff}
.post-img{width:100%;max-height:550px;object-fit:cover;display:block}
.post-actions{padding:12px;display:flex;gap:8px;flex-wrap:wrap}
.img-preview{width:100%;max-height:200px;border-radius:15px;margin-top:10px;display:none;border:2px solid #FFD700}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:12px 25px;border-radius:25px;font-weight:900;display:none;z-index:9999;box-shadow:0 5px 20px rgba(255,215,0,0.5)}
.comment-box{background:#000;border-radius:15px;padding:12px;margin:10px;border:1px solid #333}
.comment{padding:10px;background:rgba(255,215,0,0.05);border-radius:10px;margin-bottom:6px;font-size:13px;border-left:3px solid #FFD700}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px;backdrop-filter:blur(10px)}
.modal-content{background:linear-gradient(135deg,#1a1a1a,#000);border:3px solid #FFD700;border-radius:20px;padding:25px;width:100%;max-width:380px;box-shadow:0 0 40px rgba(255,215,0,0.4)}
.contact-item{padding:12px;background:linear-gradient(135deg,#000,#111);border:2px solid #333;border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:0.2s}
.contact-item:hover{border-color:#FFD700;transform:translateX(5px)}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div class="logo"><div class="logo-circle">92KG</div><div><div style="font-family:'Orbitron';font-weight:900;font-size:16px">MUST 92KG</div><div style="font-size:10px;color:#FFD700">★★★★★ VERIFIED</div></div><span class="verified">✓</span></div><div class="official">OFFICIAL 🔥</div></div></div>

<div class="stats-card">
<div class="stat"><div class="stat-num">92KG</div><div class="stat-label">WEIGHT</div></div>
<div class="stat"><div class="stat-num" style="color:#00D4FF">185CM</div><div class="stat-label">HEIGHT</div></div>
<div class="stat"><div class="stat-num" style="color:#FF00FF">14 DAYS</div><div class="stat-label">STREAK 🔥</div></div>
</div>

<div class="post-box">
<textarea id="postText" placeholder="💪 Leo 92KG - Unapiga nini? Legs? Chest?"></textarea>
<img id="preview" class="img-preview">
<div style="display:flex;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px">
<div style="display:flex;gap:8px"><button class="btn-outline" onclick="document.getElementById('fileInput').click()">📸 Picha</button><button class="btn-outline" onclick="clearImg()" id="clearBtn" style="display:none">❌</button></div>
<button class="btn-gold" onclick="createPost()">TUMA POST 🚀</button>
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)">
<div id="compressInfo" style="font-size:11px;color:#FFD700;margin-top:8px;display:none"></div>
</div>

<div id="postsContainer"></div><div id="status"></div>

<div class="modal" id="sendModal"><div class="modal-content">
<h3 style="color:#FFD700;font-family:'Orbitron'">📤 TUMA KWA NANI?</h3>
<input type="text" id="searchContact" placeholder="🔍 Tafuta jina..." oninput="filterContacts()" style="margin-top:12px">
<div id="contactList" style="max-height:200px;overflow-y:auto;margin-top:12px"></div>
<input type="text" id="customName" placeholder="Andika jina jipya" style="margin-top:10px">
<div style="display:flex;gap:10px;margin-top:15px"><button class="btn-outline" style="flex:1" onclick="closeSendModal()">Funga</button><button class="btn-gold" style="flex:1" onclick="sendToWhatsApp()">Tuma WhatsApp 💬</button></div>
</div></div>

<script>
let selectedImageData="";let posts=JSON.parse(localStorage.getItem('must92kg_posts_v4')||'[]');let currentSendPost=null;
let myContacts=JSON.parse(localStorage.getItem('must92kg_contacts')||'["Mwanafunzi MUST","Mwalimu Gym","Boi wa Chumba","Coach MUST","Rafiki wa Legs Day"]');
function showStatus(m){let s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3000);}
function handleImage(input){if(input.files&&input.files[0]){let file=input.files[0];document.getElementById('compressInfo').style.display='block';document.getElementById('compressInfo').textContent="⏳ Inapunguza: "+(file.size/1024).toFixed(0)+"KB...";let r=new FileReader();r.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement('canvas');let maxW=800;let sc=Math.min(1,maxW/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);selectedImageData=c.toDataURL('image/jpeg',0.65);document.getElementById('preview').src=selectedImageData;document.getElementById('preview').style.display='block';document.getElementById('clearBtn').style.display='block';let ns=Math.round(selectedImageData.length*0.75/1024);document.getElementById('compressInfo').textContent="✅ Imebana: "+ns+"KB - Tayari! ✨";};img.src=e.target.result;};r.readAsDataURL(file);}}
function clearImg(){selectedImageData="";document.getElementById('preview').style.display='none';document.getElementById('fileInput').value="";document.getElementById('clearBtn').style.display='none';document.getElementById('compressInfo').style.display='none';}
function createPost(){let t=document.getElementById('postText').value.trim();if(!t&&!selectedImageData){showStatus("Andika kitu!");return;}let p={id:Date.now(),text:t||"🔥 92KG GYM!",img:selectedImageData,time:new Date().toLocaleString(),likes:0,comments:[]};posts.unshift(p);localStorage.setItem('must92kg_posts_v4',JSON.stringify(posts));document.getElementById('postText').value="";clearImg();renderPosts();showStatus("Post imeng'aa! 🔥✨");}
function renderPosts(){let h="";if(posts.length==0){h='<div class="post-card" style="padding:30px;text-align:center"><div style="font-size:50px">💪</div><div style="color:#FFD700;font-weight:900;margin-top:10px;font-family:Orbitron">KARIBU MUST 92KG PREMIUM!</div><div style="color:#888;font-size:12px;margin-top:8px">Anza kutuma post yako ya kwanza sasa!</div></div>'}else{posts.forEach(p=>{let ch="";p.comments.forEach(c=>{ch+=`<div class="comment"><b style="color:#FFD700">${c.name}:</b> ${c.text}</div>`;});h+=`<div class="post-card"><div class="post-head"><div class="avatar">P</div><div><div style="font-weight:900;display:flex;gap:5px;align-items:center">Paul 92KG <span class="verified">✓</span></div><div style="font-size:11px;color:#FFD700">${p.time} • ${p.likes} likes • ${p.comments.length} comments</div></div></div>${p.text?`<div style="padding:0 14px 14px;font-size:14px">${p.text}</div>`:''}${p.img?`<img src="${p.img}" class="post-img">`:''}<div class="post-actions"><button class="btn-outline" onclick="likePost(${p.id})">❤️ Like (${p.likes})</button><button class="btn-outline" onclick="toggleComment(${p.id})">💬 Comment (${p.comments.length})</button><button class="btn-outline" style="border-color:#FFD700;color:#FFD700" onclick="openSendModal(${p.id})">📤 Tuma kwa Mtu</button></div><div class="comment-box" id="commentBox-${p.id}" style="display:none">${ch||'<div style="color:#666;font-size:12px">Hakuna comment - Kuwa wa kwanza! 💬</div>'}<div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="commentInput-${p.id}" placeholder="Andika comment..."><button class="btn-gold" onclick="addComment(${p.id})">Tuma</button></div></div></div>`;});}document.getElementById('postsContainer').innerHTML=h;}
function likePost(id){let p=posts.find(x=>x.id==id);if(p){p.likes++;localStorage.setItem('must92kg_posts_v4',JSON.stringify(posts));renderPosts();}}
function toggleComment(id){let el=document.getElementById('commentBox-'+id);el.style.display=el.style.display=='none'?'block':'none';}
function addComment(id){let i=document.getElementById('commentInput-'+id);let t=i.value.trim();if(!t)return;let p=posts.find(x=>x.id==id);if(p){p.comments.push({name:"Paul 92KG",text:t});localStorage.setItem('must92kg_posts_v4',JSON.stringify(posts));renderPosts();document.getElementById('commentBox-'+id).style.display='block';showStatus("Comment! 💬✨");}}
function openSendModal(id){currentSendPost=posts.find(x=>x.id==id);document.getElementById('sendModal').style.display='flex';renderContacts(myContacts);}
function closeSendModal(){document.getElementById('sendModal').style.display='none';currentSendPost=null;}
function renderContacts(list){let h="";list.forEach(n=>{h+=`<div class="contact-item" onclick="selectContact('${n}')"><div class="avatar" style="width:32px;height:32px;font-size:14px">${n.charAt(0)}</div><span>${n}</span></div>`;});document.getElementById('contactList').innerHTML=h;}
function filterContacts(){let q=document.getElementById('searchContact').value.toLowerCase();let f=myContacts.filter(n=>n.toLowerCase().includes(q));renderContacts(f);}
function selectContact(name){document.getElementById('customName').value=name;}
function sendToWhatsApp(){if(!currentSendPost)return;let name=document.getElementById('customName').value.trim()||"Rafiki";if(!myContacts.includes(name)){myContacts.push(name);localStorage.setItem('must92kg_contacts',JSON.stringify(myContacts));}let text=`🔥 MUST 92KG PREMIUM - Kutoka kwa Paul%0A%0A${encodeURIComponent(currentSendPost.text)}%0A%0AApp: https://paul-gram200.github.io/Paul-app/%0AImetumwa kwa: ${name}`;window.open('https://wa.me/?text='+text,'_blank');closeSendModal();showStatus(`Imefungua WhatsApp! 📤✨`);}
renderPosts();
</script>
</body>
</html>
