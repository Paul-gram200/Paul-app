<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG - Paul</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body style="background:#09090b;color:white;font-family:sans-serif">
<div style="background:#facc15;color:black;padding:16px;font-weight:900;display:flex;justify-content:space-between">
<span>MUST 92KG</span><span style="background:black;color:#facc15;padding:4px 10px;border-radius:20px;font-size:10px">PAUL LIVE</span>
</div>
<div style="max-width:420px;margin:auto;padding:16px">
<div style="background:#18181b;padding:20px;border-radius:24px;margin-bottom:16px">
<h2>ANDIKA PROGRESS</h2>
<textarea id="postInput" placeholder="Leo 92KG..." style="width:100%;background:black;color:white;padding:12px;border-radius:16px;height:90px;border:2px solid #27272a"></textarea>
<button id="postBtn" style="width:100%;margin-top:12px;background:#facc15;color:black;padding:14px;border-radius:16px;font-weight:900">TUMA KWA FIREBASE 🚀</button>
<p id="status" style="text-align:center;font-size:12px;margin-top:8px"></p>
</div>
<div style="background:#18181b;padding:20px;border-radius:24px">
<h2>FEED LIVE</h2>
<div id="feed">Inapakia...</div>
</div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyADZCCp8b71lXNBdx_pFCu5XORzRIvMNfQ",
  authDomain: "must-app-paul.firebaseapp.com",
  databaseURL: "https://must-app-paul-default-rtdb.firebaseio.com",
  projectId: "must-app-paul",
  storageBucket: "must-app-paul.firebasestorage.app",
  messagingSenderId: "4726489208",
  appId: "1:4726489208:web:323c852459292ef2872d8d",
  measurementId: "G-JYM9RGZ3QG"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
document.getElementById('postBtn').onclick = async ()=>{
  const t=document.getElementById('postInput').value;
  if(!t) return;
  document.getElementById('status').textContent="Inatuma...";
  await db.ref('posts').push({text:t,time:Date.now(),author:"Paul 92KG"});
  document.getElementById('postInput').value="";
  document.getElementById('status').textContent="✅ Imehifadhiwa Firebase!";
};
db.ref('posts').on('value',s=>{
  const d=s.val();
  if(!d){document.getElementById('feed').innerHTML="Hakuna post";return;}
  const posts=Object.values(d).reverse();
  document.getElementById('feed').innerHTML=posts.map(p=>`<div style="background:black;padding:12px;border-radius:16px;margin-bottom:8px"><b style="color:#facc15">${p.author}</b><br>${p.text}</div>`).join('');
});
</script>
</body>
</html>
