<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG V6 - CLOUD</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyADZCCp8b71lXNBdx_pFCu5XORzRIvMNfQ",
  authDomain: "must-app-paul.firebaseapp.com",
  databaseURL: "https://must-app-paul-default-rtdb.firebaseio.com",
  projectId: "must-app-paul",
  storageBucket: "must-app-paul.firebasestorage.app",
  messagingSenderId: "4726489208",
  appId: "1:4726489208:web:323c852459292ef2872d8d",
  measurementId: "G-JYM9RGZ3QG"
};
firebase.initializeApp(firebaseConfig);
const dbCloud = firebase.firestore();
const dbRealtime = firebase.database();
console.log("🔥 Firebase V6 MUST-APP-PAUL Connected");
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f0f;color:#fff;padding:10px;max-width:600px;margin:0 auto}
h1{text-align:center;padding:12px;background:linear-gradient(90deg,#ff6a00,#ee0979);border-radius:12px;margin-bottom:10px;font-size:20px}
.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}
input,textarea{width:100%;background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;margin:6px 0}
.btn{width:100%;padding:12px;background:#ff6a00;border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}
.btn:active{transform:scale(0.97)}
.searchBar{display:flex;gap:6px;margin:10px 0}
.searchBar input{flex:1}
.filters{display:flex;gap:6px;overflow:auto;padding:5px 0}
.fbtn{padding:6px 12px;border-radius:20px;border:1px solid #555;background:#222;color:#fff;white-space:nowrap}
.fbtn.active{background:#ff6a00;border-color:#ff6a00}
.post-img{width:100%;border-radius:10px;margin-top:8px;max-height:400px;object-fit:cover}
.meta{font-size:11px;color:#aaa;margin-top:6px}
.status{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#000;color:#0f0;padding:10px 20px;border-radius:30px;border:1px solid #0f0;display:none;z-index:999}
.cloud-badge{font-size:10px;background:#00f2ff;color:#000;padding:2px 6px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<h1>🏗️ MUST 92KG V6 CLOUD ☁️</h1>

<div class="card">
<textarea id="postText" rows="3" placeholder="Andika kuhusu RAMANI YA NYUMBA ZA KIJASA, SCALE 1CM=1M..."></textarea>
<input type="file" id="fileInput" accept="image/*,video/*">
<button class="btn" onclick="createPost()">📤 Tuma Post (Local + Cloud)</button>
</div>

<div class="card">
<div class="searchBar">
<input id="searchInput" placeholder="🔍 Tafuta: Kijasa, Scale, Ramani..." oninput="renderPosts()">
<button class="fbtn" onclick="loadFromCloud()">☁️ Pakua Cloud</button>
</div>
<div class="filters">
<button class="fbtn active" onclick="setFilter('all',this)">Zote</button>
<button class="fbtn" onclick="setFilter('kijasa',this)">Kijasa</button>
<button class="fbtn" onclick="setFilter('scale',this)">SCALE 1CM</button>
<button class="fbtn" onclick="setFilter('ramani',this)">Ramani</button>
<button class="fbtn" onclick="setFilter('nyumba',this)">Nyumba</button>
</div>
</div>

<div id="postsContainer"></div>
<div id="status" class="status"></div>

<script>
let posts = [];
let selectedData = null;
let selectedType = null;
let currentFilter = 'all';
let db;

function dbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open("Must92KG_V6",2);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("posts")) d.createObjectStore("posts",{keyPath:"id"})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=rej})}
function dbSave(p){return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").put(p);tx.oncomplete=()=>r()})}
function dbLoad(){return new Promise(r=>{let tx=db.transaction("posts","readonly");let req=tx.objectStore("posts").getAll();req.onsuccess=()=>r(req.result||[])})}

document.getElementById('fileInput').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return;
  let reader=new FileReader();
  reader.onload=ev=>{selectedData=ev.target.result; selectedType=f.type.startsWith('video')?'video':'image'; showStatus("Picha imechaguliwa ✓")};
  reader.readAsDataURL(f);
});

function showStatus(msg){
  let s=document.getElementById('status'); s.textContent=msg; s.style.display='block';
  setTimeout(()=>s.style.display='none',3000);
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderPosts();
}
async function createPost(){
  let t=document.getElementById('postText').value.trim();
  if(!t && !selectedData){showStatus("Andika kitu au chagua picha!"); return;}
  let p={id:Date.now(), text:t, media:selectedData||null, mediaType:selectedType||null, time:new Date().toLocaleString('sw-TZ'), likes:0, author:"PAUL 92KG"};
  posts.unshift(p);
  await dbSave(p);
  renderPosts();
  document.getElementById('postText').value="";
  selectedData=null; selectedType=null; document.getElementById('fileInput').value="";
  showStatus("⏳ Inatuma Cloud...");

  try{
    await dbCloud.collection('posts').doc(String(p.id)).set(p);
    await dbRealtime.ref('posts/'+p.id).set(p);
    showStatus("✅ Imetumwa Local + Cloud ☁️🔥");
  }catch(err){
    console.error(err);
    showStatus("✅ Local sawa, Cloud itatuma baadaye");
  }
}
function renderPosts(){
  let q=document.getElementById('searchInput').value.toLowerCase();
  let cont=document.getElementById('postsContainer'); cont.innerHTML="";
  let filtered=posts.filter(p=>{
    let matchSearch=!q || p.text.toLowerCase().includes(q);
    let matchFilter=currentFilter==='all' || p.text.toLowerCase().includes(currentFilter);
    return matchSearch && matchFilter;
  });
  if(filtered.length===0){cont.innerHTML="<div class='card' style='text-align:center;color:#777'>Hakuna posts - Andika au pakua kutoka Cloud ☁️</div>"; return;}
  filtered.forEach(p=>{
    let div=document.createElement('div'); div.className='card';
    let mediaHtml="";
    if(p.media){ if(p.mediaType==='video') mediaHtml=`<video src="${p.media}" controls class="post-img"></video>`; else mediaHtml=`<img src="${p.media}" class="post-img">`; }
    div.innerHTML=`<div style="font-weight:bold">PAUL 92KG <span class="cloud-badge">V6 CLOUD</span></div><div style="margin:8px 0;white-space:pre-wrap">${p.text||''}</div>${mediaHtml}<div class="meta">🕒 ${p.time} • ${p.likes} likes</div>`;
    cont.appendChild(div);
  });
}
async function loadFromCloud(){
  showStatus("☁️ Inapakua kutoka must-app-paul...");
  try{
    let snap=await dbCloud.collection('posts').orderBy('id','desc').limit(50).get();
    let cloudPosts=[];
    snap.forEach(doc=>{cloudPosts.push(doc.data())});
    if(cloudPosts.length===0){showStatus("Hakuna posts Cloud bado"); return;}
    for(let cp of cloudPosts){
      if(!posts.find(x=>x.id===cp.id)){posts.push(cp); await dbSave(cp);}
    }
    posts.sort((a,b)=>b.id-a.id);
    renderPosts();
    showStatus(`✅ ${cloudPosts.length} posts kutoka Cloud!`);
  }catch(e){console.error(e); showStatus("❌ Imeshindikana kupakua Cloud")}
}

(async()=>{
  await dbOpen();
  posts=await dbLoad();
  posts.sort((a,b)=>b.id-a.id);
  renderPosts();
  showStatus("✅ V6 must-app-paul Iko Tayari!");
  setTimeout(loadFromCloud,1500);
})();
</script>
</body>
</html>
