<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG - PAUL PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:#000;color:#fff}
.header{background:#FFD700;color:#000;padding:15px;font-weight:900;text-align:center;font-size:18px;position:sticky;top:0;z-index:20}
.container{max-width:500px;margin:auto;padding:15px}
.post-box{background:#111;border:1px solid #333;border-radius:15px;padding:15px;margin-bottom:20px}
textarea{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:10px;padding:12px;min-height:70px;font-size:15px;outline:none}
.btn{background:#FFD700;color:#000;border:none;width:100%;padding:14px;border-radius:10px;font-weight:900;font-size:16px;margin-top:10px;cursor:pointer}
.btn2{background:#222;color:#FFD700;border:1px solid #333;padding:8px 12px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;margin-right:8px}
.status{text-align:center;color:#FFD700;font-size:13px;margin:8px 0;height:18px}
.feed-item{background:#111;border:1px solid #222;border-radius:15px;padding:15px;margin-bottom:12px}
.feed-name{color:#FFD700;font-weight:800;font-size:14px}
.feed-text{font-size:15px;margin:8px 0;line-height:1.4;white-space:pre-wrap}
.feed-img{width:100%;border-radius:12px;margin-top:10px;max-height:400px;object-fit:cover}
.feed-time{font-size:11px;color:#666;margin-top:6px}
.actions{margin-top:10px;display:flex;align-items:center}
.preview{width:100%;border-radius:10px;margin-top:10px;display:none;max-height:250px;object-fit:cover}
.file-label{color:#FFD700;font-size:13px;margin-top:8px;display:inline-block;cursor:pointer;border:1px dashed #444;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>
<div class="header">MUST 92KG - PAUL PRO 💪🔥</div>
<div class="container">
<div class="post-box">
<textarea id="postInput" placeholder="Leo Legs Day? Andika hapa..."></textarea>
<label class="file-label">📸 Chagua Picha ya Gym <input type="file" id="imgInput" accept="image/*" hidden onchange="previewImg(event)"></label>
<img id="preview" class="preview">
<button class="btn" id="tumaBtn" onclick="tumaPost()">TUMA POST 🔥</button>
<div class="status" id="status"></div>
</div>
<div id="feed"></div>
</div>

<script>
const DB_URL = "https://must-app-paul-default-rtdb.firebaseio.com/posts.json";
let selectedBase64 = "";

function previewImg(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    selectedBase64 = reader.result;
    const p = document.getElementById('preview');
    p.src = selectedBase64;
    p.style.display="block";
  };
  reader.readAsDataURL(file);
}

async function loadPosts(){
  const feed = document.getElementById('feed');
  try{
    const res = await fetch(DB_URL);
    const data = await res.json();
    feed.innerHTML="";
    if(!data){ feed.innerHTML="<p style='text-align:center;color:#555;margin-top:20px;'>Hakuna post. Anza sasa!</p>"; return; }
    const entries = Object.entries(data).sort((a,b)=>b[1].time - a[1].time);
    entries.forEach(([key, p])=>{
      const d = new Date(p.time);
      const div = document.createElement('div');
      div.className="feed-item";
      div.innerHTML=`
        <div class="feed-name">Paul 92KG 💪</div>
        <div class="feed-text">${(p.text||"")}</div>
        ${p.image ? `<img src="${p.image}" class="feed-img">` : ""}
        <div class="feed-time">${d.toLocaleString()} • ${p.likes||0} likes</div>
        <div class="actions">
          <button class="btn2" onclick="likePost('${key}', ${p.likes||0})">❤️ Like (${p.likes||0})</button>
          <button class="btn2" onclick="this.nextElementSibling.style.display='block'">💬 Comment</button>
          <div style="display:none;margin-top:8px;width:100%"><input style="width:70%;background:#000;border:1px solid #333;color:#fff;padding:6px;border-radius:6px" placeholder="Andika comment..."><button class="btn2">Tuma</button></div>
        </div>
      `;
      feed.appendChild(div);
    });
  }catch(e){ feed.innerHTML="<p style='color:red;text-align:center'>Error: "+e.message+"</p>"; }
}

async function tumaPost(){
  const input = document.getElementById('postInput');
  const text = input.value.trim();
  const st = document.getElementById('status');
  const btn = document.getElementById('tumaBtn');
  if(!text && !selectedBase64){ st.innerText="Andika au chagua picha!"; return; }
  btn.disabled=true; st.innerText="Inatuma...";
  try{
    await fetch(DB_URL, {
      method:"POST",
      body: JSON.stringify({ name:"Paul 92KG", text:text, image:selectedBase64, likes:0, time:Date.now() }),
      headers:{"Content-Type":"application/json"}
    });
    input.value=""; selectedBase64=""; document.getElementById('preview').style.display="none"; document.getElementById('imgInput').value="";
    st.innerText="✅ Imehifadhiwa PRO!"; loadPosts();
    setTimeout(()=>st.innerText="",2000);
  }catch(e){ st.innerText="❌ "+e.message; }
  btn.disabled=false;
}

async function likePost(key, currentLikes){
  const url = `https://must-app-paul-default-rtdb.firebaseio.com/posts/${key}.json`;
  await fetch(url, { method:"PATCH", body:JSON.stringify({likes: currentLikes+1}), headers:{"Content-Type":"application/json"} });
  loadPosts();
}

loadPosts();
setInterval(loadPosts, 8000);
</script>
</body>
</html>
