<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG V3</title>
<link rel="manifest" href="/Paul-app/manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;padding-bottom:80px}
.header{background:#111;padding:12px 15px;display:flex;justify-content:space-between;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:100}
.logo-circle{width:42px;height:42px;background:linear-gradient(135deg,#FFD700,#FFA500);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000}
.verified{width:20px;height:20px;background:#1DA1F2;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.official{background:#FFD700;color:#000;padding:4px 8px;border-radius:12px;font-size:10px;font-weight:900}
.profile-card,.post-box,.post-card{background:#1a1a1a;margin:12px;border-radius:16px;padding:15px;border:1px solid #333}
.avatar{width:56px;height:56px;background:#FFD700;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:24px}
textarea,input{width:100%;background:#000;color:#fff;border:1px solid #333;border-radius:12px;padding:12px}
.btn-gold{background:#FFD700;color:#000;border:none;padding:10px 18px;border-radius:20px;font-weight:900;cursor:pointer}
.btn-outline{border:1px solid #444;background:#000;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;margin:2px}
.post-img{width:100%;max-height:500px;object-fit:cover}
.img-preview{width:100%;max-height:200px;border-radius:12px;margin-top:10px;display:none;border:2px solid #FFD700}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#FFD700;color:#000;padding:10px 20px;border-radius:20px;font-weight:700;display:none;z-index:9999}
.comment-box{background:#000;border-radius:12px;padding:10px;margin-top:10px;border:1px solid #333}
.comment{padding:8px 0;border-bottom:1px solid #222;font-size:13px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
.modal-content{background:#1a1a1a;border:2px solid #FFD700;border-radius:16px;padding:20px;width:100%;max-width:350px}
.contact-item{padding:10px;background:#000;border:1px solid #333;border-radius:10px;margin-bottom:6px;cursor:pointer;display:flex;gap:10px;align-items:center}
.contact-item:hover{border-color:#FFD700}
</style>
</head>
<body>
<div class="header"><div style="display:flex;gap:10px;align-items:center"><div class="logo-circle">92KG</div><b>MUST 92KG</b><span class="verified">✓</span></div><div class="official">OFFICIAL</div></div>
<div class="profile-card"><div style="display:flex;gap:12px"><div class="avatar">P</div><div><b>Paul 92KG ✓</b><div style="font-size:12px;color:#aaa">MUST • Legs Day Specialist</div></div></div></div>

<div class="post-box">
<textarea id="postText" placeholder="Leo 92KG - Unapiga nini? 💪"></textarea>
<img id="preview" class="img-preview">
<div style="display:flex;justify-content:space-between;margin-top:12px"><div style="display:flex;gap:8px"><button class="btn-outline" onclick="document.getElementById('fileInput').click()">📸 Chagua Picha</button><button class="btn-outline" onclick="clearImg()" id="clearBtn" style="display:none">❌</button></div><button class="btn-gold" onclick="createPost()">TUMA POST 🔥</button></div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(this)">
<div id="compressInfo" style="font-size:11px;color:#FFD700;margin-top:6px;display:none"></div>
</div>

<div id="postsContainer"></div><div id="status"></div>

<div class="modal" id="sendModal">
<div class="modal-content">
<h3 style="color:#FFD700">📤 Tuma kwa Nani?</h3>
<input type="text" id="searchContact" placeholder="Tafuta jina..." oninput="filterContacts()" style="margin-top:10px">
<div id="contactList" style="max-height:200px;overflow-y:auto;margin-top:10px"></div>
<input type="text" id="customName" placeholder="Andika jina / namba" style="margin-top:10px">
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn-outline" style="flex:1" onclick="closeSendModal()">Funga</button><button class="btn-gold" style="flex:1" onclick="sendToWhatsApp()">Tuma WhatsApp 💬</button></div>
</div>
</div>

<script>
let selectedImageData="";let posts=JSON.parse(localStorage.getItem('must92kg_posts_v3')||'[]');let currentSendPost=null;
let myContacts=JSON.parse(localStorage.getItem('must92kg_contacts')||'["Mwanafunzi MUST 1","Mwalimu Gym","Rafiki Legs Day","Boi wa Chumba","Coach MUST"]');
function showStatus(m){let s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3000);}
function handleImage(input){if(input.files&&input.files[0]){let file=input.files[0];document.getElementById('compressInfo').style.display='block';document.getElementById('compressInfo').textContent="⏳ Inapunguza: "+(file.size/1024).toFixed(0)+"KB...";let r=new FileReader();r.onload=function(e){let img=new Image();img.onload=function(){let c=document.createElement('canvas');let maxW=800;let sc=Math.min(1,maxW/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);selectedImageData=c.toDataURL('image/jpeg',0.6);document.getElementById('preview').src=selectedImageData;document.getElementById('preview').style.display='block';document.getElementById('clearBtn').style.display='block';let ns=Math.round(selectedImageData.length*0.75/1024);document.getElementById('compressInfo').textContent="✅ Imebana: "+ns+"KB - Tayari!";};img.src=e.target.result;};r.readAsDataURL(file);}}
function clearImg(){selectedImageData="";document.getElementById('preview').style.display='none';document.getElementById('fileInput').value="";document.getElementById('clearBtn').style.display='none';document.getElementById('compressInfo').style.display='none';}
function createPost(){let t=document.getElementById('postText').value.trim();if(!t&&!selectedImageData){showStatus("Andika kitu!");return;}let p={id:Date.now(),text:t||"🔥 92KG!",img:selectedImageData,time:new Date().toLocaleString(),likes:0,comments:[]};posts.unshift(p);localStorage.setItem('must92kg_posts_v3',JSON.stringify(posts));document.getElementById('postText').value="";clearImg();renderPosts();showStatus("Post imetumwa! 🔥");}
function renderPosts(){let h="";if(posts.length==0){h='<div class="post-card" style="text-align:center;color:#aaa">Hakuna post - Anza!</div>'}else{posts.forEach(p=>{let ch="";p.comments.forEach(c=>{ch+=`<div class="comment"><b style="color:#FFD700">${c.name}:</b> ${c.text}</div>`;});h+=`<div class="post-card"><div style="padding:12px;display:flex;gap:10px"><div class="avatar" style="width:36px;height:36px;font-size:16px">P</div><div><div style="font-weight:700">Paul 92KG ✓</div><div style="font-size:11px;color:#888">${p.time} • ${p.likes} likes</div></div></div>${p.text?`<div style="padding:0 12px 12px">${p.text}</div>`:''}${p.img?`<img src="${p.img}" class="post-img">`:''}<div style="padding:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn-outline" onclick="likePost(${p.id})">❤️ Like (${p.likes})</button><button class="btn-outline" onclick="toggleComment(${p.id})">💬 Comment (${p.comments.length})</button><button class="btn-outline" style="border-color:#FFD700;color:#FFD700" onclick="openSendModal(${p.id})">📤 Tuma kwa Mtu</button></div><div class="comment-box" id="commentBox-${p.id}" style="display:none">${ch||'<div style="font-size:12px;color:#666">Hakuna comment</div>'}<div style="display:flex;gap:6px;margin-top:10px"><input type="text" id="commentInput-${p.id}" placeholder="Andika comment..."><button class="btn-gold" onclick="addComment(${p.id})">Tuma</button></div></div></div>`;});}document.getElementById('postsContainer').innerHTML=h;}
function likePost(id){let p=posts.find(x=>x.id==id);if(p){p.likes++;localStorage.setItem('must92kg_posts_v3',JSON.stringify(posts));renderPosts();}}
function toggleComment(id){let el=document.getElementById('commentBox-'+id);el.style.display=el.style.display=='none'?'block':'none';}
function addComment(id){let i=document.getElementById('commentInput-'+id);let t=i.value.trim();if(!t)return;let p=posts.find(x=>x.id==id);if(p){p.comments.push({name:"Paul 92KG",text:t});localStorage.setItem('must92kg_posts_v3',JSON.stringify(posts));renderPosts();document.getElementById('commentBox-'+id).style.display='block';showStatus("Comment! 💬");}}
function openSendModal(id){currentSendPost=posts.find(x=>x.id==id);document.getElementById('sendModal').style.display='flex';renderContacts(myContacts);}
function closeSendModal(){document.getElementById('sendModal').style.display='none';currentSendPost=null;}
function renderContacts(list){let h="";list.forEach(n=>{h+=`<div class="contact-item" onclick="selectContact('${n}')"><div class="avatar" style="width:32px;height:32px;font-size:12px">${n.charAt(0)}</div><span>${n}</span></div>`;});document.getElementById('contactList').innerHTML=h;}
function filterContacts(){let q=document.getElementById('searchContact').value.toLowerCase();let f=myContacts.filter(n=>n.toLowerCase().includes(q));renderContacts(f);}
function selectContact(name){document.getElementById('customName').value=name;}
function sendToWhatsApp(){if(!currentSendPost)return;let name=document.getElementById('customName').value.trim()||"Rafiki";if(!myContacts.includes(name)){myContacts.push(name);localStorage.setItem('must92kg_contacts',JSON.stringify(myContacts));}let text=`🔥 MUST 92KG - Kutoka kwa Paul%0A%0A${encodeURIComponent(currentSendPost.text)}%0A%0AApp: https://paul-gram200.github.io/Paul-app/%0AImetumwa kwa: ${name}`;window.open('https://wa.me/?text='+text,'_blank');closeSendModal();showStatus(`Imefungua WhatsApp kwa ${name}!`);}
renderPosts();
</script>
</body>
</html>
