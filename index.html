<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG V6.1 - CLOUD</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyADZCCp8b71lXNBdx_pFCu5XORzRIvMNfQ",
  authDomain: "must-app-paul.firebaseapp.com",
  databaseURL: "https://must-app-paul-default-rtdb.firebaseio.com",
  projectId: "must-app-paul",
  storageBucket: "must-app-paul.firebasestorage.app",
  messagingSenderId: "4726489208",
  appId: "1:4726489208:web:323c852459292ef2872d8d",
  measurementId: "G-JYM9RGZ3QG"
};
firebase.initializeApp(firebaseConfig);
const dbCloud = firebase.firestore();
const dbRealtime = firebase.database();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f0f0f;color:#fff;padding:10px;max-width:600px;margin:0 auto}
h1{text-align:center;padding:12px;background:linear-gradient(90deg,#ff6a00,#ee0979);border-radius:12px;margin-bottom:10px;font-size:18px}
.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}
input,textarea{width:100%;background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:10px;margin:6px 0}
.btn{width:100%;padding:12px;background:#ff6a00;border:none;border-radius:10px;color:#fff;font-weight:bold;font-size:16px;margin-top:8px}
.fbtn{padding:6px 12px;border-radius:20px;border:1px solid #555;background:#222;color:#fff;white-space:nowrap;margin:2px}
.fbtn.active{background:#ff6a00}
.post-img{width:100%;border-radius:10px;margin-top:8px;max-height:400px;object-fit:cover}
.meta{font-size:11px;color:#aaa;margin-top:6px;display:flex;justify-content:space-between}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.abtn{padding:6px 10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;font-size:12px}
.comment-box{background:#111;border-radius:8px;padding:8px;margin-top:8px}
.status{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#000;color:#0f0;padding:10px 20px;border-radius:30px;border:1px solid #0f0;display:none;z-index:999}
.searchBar{display:flex;gap:6px;margin:10px 0}
</style>
</head>
<body>
<h1>🏗️ MUST 92KG V6.1 CLOUD ☁️</h1>

<div class="card">
<textarea id="postText" rows="3" placeholder="Andika RAMANI YA NYUMBA ZA KISASA, SCALE 1CM=1M..."></textarea>
<input type="file" id="fileInput" accept="image/*,video/*">
<button class="btn" onclick="createPost()">📤 Tuma Post</button>
</div>

<div class="card">
<div class="searchBar">
<input id="searchInput" placeholder="🔍 Tafuta: Kisasa, Scale, Ramani..." oninput="renderPosts()">
<button class="fbtn" onclick="loadFromCloud()">☁️ Pakua Cloud</button>
</div>
<div style="display:flex;gap:6px;overflow:auto">
<button class="fbtn active" onclick="setFilter('all',this)">Zote</button>
<button class="fbtn" onclick="setFilter('kisasa',this)">Kisasa</button>
<button class="fbtn" onclick="setFilter('scale',this)">SCALE</button>
<button class="fbtn" onclick="setFilter('ramani',this)">Ramani</button>
</div>
</div>

<div id="postsContainer"></div>
<div id="status" class="status"></div>

<script>
let posts=[], selectedData=null, selectedType=null, currentFilter='all', db;
function dbOpen(){return new Promise((res,rej)=>{let r=indexedDB.open("Must92KG_V61",2);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains("posts")) d.createObjectStore("posts",{keyPath:"id"})};r.onsuccess=e=>{db=e.target.result;res()};r.onerror=rej})}
function dbSave(p){return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").put(p);tx.oncomplete=()=>r()})}
function dbDel(id){return new Promise(r=>{let tx=db.transaction("posts","readwrite");tx.objectStore("posts").delete(id);tx.oncomplete=()=>r()})}
function dbLoad(){return new Promise(r=>{let tx=db.transaction("posts","readonly");let req=tx.objectStore("posts").getAll();req.onsuccess=()=>r(req.result||[])})}

document.getElementById('fileInput').addEventListener('change', e=>{
  let f=e.target.files[0]; if(!f) return;
  let reader=new FileReader();
  reader.onload=ev=>{selectedData=ev.target.result; selectedType=f.type.startsWith('video')?'video':'image'; showStatus("Picha imechaguliwa ✓")};
  reader.readAsDataURL(f);
});
function showStatus(m){let s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3000)}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');renderPosts()}

async function createPost(){
  let t=document.getElementById('postText').value.trim();
  if(!t && !selectedData){showStatus("Andika kitu!");return;}
  let p={id:Date.now(), text:t, media:selectedData||null, mediaType:selectedType||null, time:new Date().toLocaleString('sw-TZ'), likes:0, comments:[], author:"PAUL 92KG"};
  posts.unshift(p); await dbSave(p); renderPosts();
  document.getElementById('postText').value=""; selectedData=null; selectedType=null; document.getElementById('fileInput').value="";
  showStatus("⏳ Inatuma Cloud...");
  try{ await dbCloud.collection('posts').doc(String(p.id)).set(p); await dbRealtime.ref('posts/'+p.id).set(p); showStatus("✅ Local + Cloud ☁️"); }catch(e){showStatus("✅ Local sawa")}
}
function deletePost(id){
  if(!confirm("Futa hii post?")) return;
  posts=posts.filter(p=>p.id!==id); dbDel(id); renderPosts();
  try{ dbCloud.collection('posts').doc(String(id)).delete(); dbRealtime.ref('posts/'+id).remove(); }catch(e){}
  showStatus("🗑️ Imefutwa");
}
function likePost(id){
  let p=posts.find(x=>x.id===id); if(!p) return; p.likes=(p.likes||0)+1; dbSave(p); renderPosts();
  try{ dbCloud.collection('posts').doc(String(id)).update({likes:p.likes}); }catch(e){}
}
function addComment(id){
  let inp=document.getElementById('c-'+id); if(!inp) return;
  let txt=inp.value.trim(); if(!txt) return;
  let p=posts.find(x=>x.id===id); if(!p) return;
  if(!p.comments) p.comments=[];
  p.comments.push({text:txt,time:new Date().toLocaleString('sw-TZ')});
  dbSave(p); renderPosts();
  try{ dbCloud.collection('posts').doc(String(id)).update({comments:p.comments}); }catch(e){}
}
function shareWhatsApp(id){
  let p=posts.find(x=>x.id===id); if(!p) return;
  let msg=encodeURIComponent("🏗️ MUST 92KG - RAMANI YA NYUMBA ZA KISASA:\n\n"+p.text+"\n\nApp: https://paul-gram200.github.io/Paul-app/");
  window.open("https://wa.me/?text="+msg,"_blank");
}
function shareChat(id){
  let p=posts.find(x=>x.id===id); if(!p) return;
  let msg="CHAT: "+p.text;
  if(navigator.share){ navigator.share({title:"MUST 92KG",text:msg,url:"https://paul-gram200.github.io/Paul-app/"}); }
  else{ showStatus("Chat: "+p.text.substring(0,30)+"..."); }
}
function renderPosts(){
  let q=document.getElementById('searchInput').value.toLowerCase();
  let cont=document.getElementById('postsContainer'); cont.innerHTML="";
  let filtered=posts.filter(p=>{
    let ms=!q || p.text.toLowerCase().includes(q);
    let mf=currentFilter==='all' || p.text.toLowerCase().includes(currentFilter);
    return ms && mf;
  });
  if(filtered.length===0){cont.innerHTML="<div class='card' style='text-align:center;color:#777'>Hakuna posts</div>";return;}
  filtered.forEach(p=>{
    let d=document.createElement('div'); d.className='card';
    let mediaHtml=""; if(p.media){ if(p.mediaType==='video') mediaHtml=`<video src="${p.media}" controls class="post-img"></video>`; else mediaHtml=`<img src="${p.media}" class="post-img">`; }
    let commentsHtml=""; if(p.comments && p.comments.length){ commentsHtml="<div class='comment-box'>"; p.comments.forEach(c=>{commentsHtml+=`<div style='font-size:12px;padding:4px 0;border-bottom:1px solid #222'>💬 ${c.text} <span style='color:#777;font-size:10px'>${c.time}</span></div>`}); commentsHtml+="</div>"; }
    d.innerHTML=`
      <div style="font-weight:bold">PAUL 92KG <span style="font-size:10px;background:#00f2ff;color:#000;padding:2px 6px;border-radius:10px">V6.1 CLOUD</span></div>
      <div style="margin:8px 0;white-space:pre-wrap">${p.text||''}</div>
      ${mediaHtml}
      <div class="meta"><span>🕒 ${p.time}</span><span>❤️ ${p.likes||0} likes</span></div>
      <div class="actions">
        <button class="abtn" onclick="likePost(${p.id})">❤️ Like</button>
        <button class="abtn" onclick="shareWhatsApp(${p.id})">🟢 WhatsApp</button>
        <button class="abtn" onclick="shareChat(${p.id})">💬 Chat/Share</button>
        <button class="abtn" style="background:#400" onclick="deletePost(${p.id})">🗑️ Delete</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <input id="c-${p.id}" placeholder="Andika comment...">
        <button class="abtn" onclick="addComment(${p.id})">Tuma</button>
      </div>
      ${commentsHtml}
    `;
    cont.appendChild(d);
  });
}
async function loadFromCloud(){
  showStatus("☁️ Inapakua...");
  try{
    let snap=await dbCloud.collection('posts').orderBy('id','desc').limit(50).get();
    let cp=[]; snap.forEach(d=>cp.push(d.data()));
    if(cp.length===0){showStatus("Hakuna Cloud");return;}
    for(let x of cp){ if(!posts.find(p=>p.id===x.id)){posts.push(x); await dbSave(x);} }
    posts.sort((a,b)=>b.id-a.id); renderPosts(); showStatus(`✅ ${cp.length} kutoka Cloud`);
  }catch(e){showStatus("❌ Cloud error")}
}
(async()=>{await dbOpen(); posts=await dbLoad(); posts.sort((a,b)=>b.id-a.id); renderPosts(); showStatus("✅ V6.1 Tayari - KISASA + Chat + Comment + WhatsApp + Delete"); setTimeout(loadFromCloud,1500)})();
</script>
</body>
</html>
