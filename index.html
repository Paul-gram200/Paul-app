<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUST 92KG ULTIMATE V5</title>
<link rel="manifest" href="/Paul-app/manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#1a1a00 0%,#000 70%);color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;padding-bottom:90px}
.header{background:linear-gradient(135deg,#000,#1a1a00);padding:15px;border-bottom:3px solid #FFD700;position:sticky;top:0;z-index:100;box-shadow:0 5px 25px rgba(255,215,0,0.4)}
.logo-circle{width:55px;height:55px;background:linear-gradient(135deg,#FFD700,#FF8C00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:900;color:#000;font-size:16px;border:3px solid #fff;box-shadow:0 0 20px #FFD700}
.verified{width:22px;height:22px;background:linear-gradient(135deg,#1DA1F2,#00D4FF);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:12px}
.official{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:6px 12px;border-radius:20px;font-weight:900;font-size:11px}
.stats-card{background:linear-gradient(135deg,rgba(255,215,0,0.15),rgba(0,0,0,0.9));border:2px solid #FFD700;border-radius:20px;padding:15px;margin:12px;display:flex;justify-content:space-around;box-shadow:0 0 20px rgba(255,215,0,0.2)}
.stat-num{font-family:'Orbitron';font-size:20px;font-weight:900;color:#FFD700}
.stat-label{font-size:10px;color:#aaa}
.post-box{background:linear-gradient(135deg,#1a1a1a,#0f0f0f);border:2px solid #333;border-radius:20px;padding:15px;margin:12px}
textarea,input{width:100%;background:#000;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:14px;outline:none}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;border:none;padding:12px 22px;border-radius:25px;font-weight:900;cursor:pointer;box-shadow:0 4px 15px rgba(255,215,0,0.4)}
.btn-outline{border:2px solid #444;background:rgba(0,0,0,0.6);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;margin:2px}
.btn-danger{border:2px solid #ff4444;background:#000;color:#ff4444;padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer}
.post-card{background:linear-gradient(135deg,#1e1e1e,#0a0a0a);border:1px solid #333;border-radius:20px;margin:12px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.6)}
.post-head{padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(255,215,0,0.1),transparent)}
.avatar{width:46px;height:46px;background:linear-gradient(135deg,#FFD700,#FF8C00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:18px;border:2px solid #fff}
.post-media{width:100%;max-height:600px;object-fit:cover;display:block;background:#000}
.post-actions{padding:12px;display:flex;gap:6px;flex-wrap:wrap}
.img-preview{width:100%;max-height:250px;border-radius:15px;margin-top:10px;display:none;border:2px solid #FFD700}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:12px 25px;border-radius:25px;font-weight:900;display:none;z-index:9999}
.comment-box{background:#000;border-radius:15px;padding:12px;margin:10px;border:1px solid #333}
.comment{padding:10px;background:rgba(255,215,0,0.07);border-radius:10px;margin-bottom:6px;font-size:13px;border-left:3px solid #FFD700;display:flex;justify-content:space-between}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:10000;padding:20px}
.modal-content{background:linear-gradient(135deg,#1a1a1a,#000);border:3px solid #FFD700;border-radius:20px;padding:25px;width:100%;max-width:380px}
.contact-item{padding:12px;background:#000;border:2px solid #333;border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:center}
.contact-item:hover{border-color:#FFD700}
.storage-bar{height:6px;background:#333;border-radius:10px;overflow:hidden;margin-top:8px}
.storage-fill{height:100%;background:linear-gradient(90deg,#FFD700,#FF8C00);transition:width 0.3s}
</style>
</head>
<body>
<div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:10px;align-items:center"><div class="logo-circle">92KG</div><div><div style="font-family:'Orbitron';font-weight:900">MUST 92KG</div><div style="font-size:10px;color:#FFD700">★★★★★ VERIFIED ULTIMATE</div></div><span class="verified">✓</span></div><div class="official">V5 🔥</div></div><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:11px;color:#aaa"><span>Storage: <span id="storageText">0 / 1000+ Posts</span></span><span id="countText">0 Posts</span></div><div class="storage-bar"><div class="storage-fill" id="storageFill" style="width:0%"></div></div></div></div>
<div class="stats-card"><div style="text-align:center"><div class="stat-num">92KG</div><div class="stat-label">WEIGHT</div></div><div style="text-align:center"><div class="stat-num" style="color:#00D4FF">185CM</div><div class="stat-label">HEIGHT</div></div><div style="text-align:center"><div class="stat-num" style="color:#FF00FF" id="postCount">0</div><div class="stat-label">POSTS</div></div><div style="text-align:center"><div class="stat-num" style="color:#00FF88" id="videoCount">0</div><div class="stat-label">VIDEOS</div></div></div>
<div class="post-box">
<textarea id="postText" placeholder="💪 Leo 92KG - Legs? Chest?"></textarea>
<img id="previewImg" class="img-preview"><video id="previewVideo" class="img-preview" controls style="display:none"></video>
<div id="fileInfo" style="font-size:11px;color:#FFD700;margin-top:8px;display:none"></div>
<div style="display:flex;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px"><div style="display:flex;gap:6px"><button class="btn-outline" onclick="document.getElementById('fileImage').click()">📸 Picha</button><button class="btn-outline" onclick="document.getElementById('fileVideo').click()">🎥 Video</button><button class="btn-outline" onclick="clearMedia()" id="clearBtn" style="display:none">❌ Futa</button></div><button class="btn-gold" onclick="createPost()">TUMA POST 🚀</button></div>
<input type="file" id="fileImage" accept="image/*" style="display:none" onchange="handleImage(this)"><input type="file" id="fileVideo" accept="video/*" style="display:none" onchange="handleVideo(this)"></div>
<div id="postsContainer"></div><div id="status"></div>
<div class="modal" id="sendModal"><div class="modal-content"><h3 style="color:#FFD700;font-family:'Orbitron'">📤 TUMA KWA NANI?</h3><input type="text" id="searchContact" placeholder="🔍 Tafuta jina..." oninput="filterContacts()" style="margin-top:12px"><div id="contactList" style="max-height:200px;overflow-y:auto;margin-top:12px"></div><input type="text" id="customName" placeholder="Andika jina / namba WhatsApp" style="margin-top:10px"><div style="display:flex;gap:10px;margin-top:15px"><button class="btn-outline" style="flex:1" onclick="closeSendModal()">Funga</button><button class="btn-gold" style="flex:1" onclick="sendToWhatsApp()">Tuma WhatsApp 💬</button></div></div></div>
<script>
let db;let posts=[];let selectedData="";let selectedType="";let myContacts=JSON.parse(localStorage.getItem('must92kg_contacts_v5')||'["Mwanafunzi MUST","Mwalimu Gym","Boi wa Chumba","Coach MUST","Rafiki wa Legs Day"]');
function initDB(){return new Promise((res,rej)=>{let req=indexedDB.open('MUST92KG_DB',1);req.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains('posts'))d.createObjectStore('posts',{keyPath:'id'});};req.onsuccess=e=>{db=e.target.result;res();};req.onerror=rej;});}
function dbSave(post){return new Promise((res,rej)=>{let tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(post);tx.oncomplete=res;});}
function dbGetAll(){return new Promise((res,rej)=>{let tx=db.transaction('posts','readonly');let req=tx.objectStore('posts').getAll();req.onsuccess=()=>res(req.result);});}
function dbDelete(id){return new Promise((res)=>{let tx=db.transaction('posts','readwrite');tx.objectStore('posts').delete(id);tx.oncomplete=res;});}
function showStatus(m){let s=document.getElementById('status');s.textContent=m;s.style.display='block';setTimeout(()=>s.style.display='none',3500);}
function handleImage(input){if(!input.files[0])return;let file=input.files[0];if(file.size>10*1024*1024){showStatus('Picha kubwa <10MB');return;}document.getElementById('fileInfo').style.display='block';document.getElementById('fileInfo').textContent='⏳ Inapunguza: '+(file.size/1024).toFixed(0)+'KB...';let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let maxW=900;let sc=Math.min(1,maxW/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);selectedData=c.toDataURL('image/jpeg',0.7);selectedType='image';document.getElementById('previewImg').src=selectedData;document.getElementById('previewImg').style.display='block';document.getElementById('previewVideo').style.display='none';document.getElementById('clearBtn').style.display='block';let ns=Math.round(selectedData.length*0.75/1024);document.getElementById('fileInfo').textContent='✅ Picha: '+ns+'KB - Tayari!';};img.src=e.target.result;};r.readAsDataURL(file);}
function handleVideo(input){if(!input.files[0])return;let file=input.files[0];if(file.size>50*1024*1024){showStatus('Video <50MB');return;}document.getElementById('fileInfo').style.display='block';document.getElementById('fileInfo').textContent='⏳ Video: '+(file.size/1024/1024).toFixed(1)+'MB...';let r=new FileReader();r.onload=e=>{selectedData=e.target.result;selectedType='video';document.getElementById('previewVideo').src=selectedData;document.getElementById('previewVideo').style.display='block';document.getElementById('previewImg').style.display='none';document.getElementById('clearBtn').style.display='block';document.getElementById('fileInfo').textContent='✅ Video: '+(file.size/1024/1024).toFixed(1)+'MB - Tayari!';};r.readAsDataURL(file);}
function clearMedia(){selectedData="";selectedType="";document.getElementById('previewImg').style.display='none';document.getElementById('previewVideo').style.display='none';document.getElementById('clearBtn').style.display='none';document.getElementById('fileInfo').style.display='none';}
async function createPost(){let t=document.getElementById('postText').value.trim();if(!t&&!selectedData){showStatus('Andika kitu!');return;}let p={id:Date.now(),text:t||(selectedType=='video'?'🎥 Video 92KG!':'🔥 92KG!'),media:selectedData,mediaType:selectedType,time:new Date().toLocaleString(),likes:0,comments:[]};posts.unshift(p);await dbSave(p);document.getElementById('postText').value="";clearMedia();renderPosts();updateStats();showStatus('Imetumwa! 🔥');}
function renderPosts(){let h="";if(posts.length==0){h='<div class="post-card" style="padding:35px;text-align:center"><div style="font-size:60px">💪</div><div style="color:#FFD700;font-weight:900;margin-top:10px;font-family:Orbitron">KARIBU ULTIMATE!</div><div style="color:#888;font-size:13px;margin-top:10px">Sasa: 📸 1000+ Picha<br>🎥 Video 50MB<br>💬 Comment & Like<br>📤 Tuma kwa Mtu<br>🗑️ Futa</div></div>';}else{posts.forEach(p=>{let ch="";p.comments.forEach((c,i)=>{ch+=`<div class="comment"><span><b style="color:#FFD700">${c.name}:</b> ${c.text}</span><button class="btn-danger" style="padding:2px 8px" onclick="deleteComment(${p.id},${i})">X</button></div>`;});let mediaHtml="";if(p.media){if(p.mediaType=='video'){mediaHtml=`<video src="${p.media}" class="post-media" controls playsinline></video>`;}else{mediaHtml=`<img src="${p.media}" class="post-media">`;}}h+=`<div class="post-card"><div class="post-head"><div style="display:flex;gap:12px;align-items:center"><div class="avatar">P</div><div><div style="font-weight:900;display:flex;gap:5px">Paul 92KG <span class="verified">✓</span> ${p.mediaType=='video'?'<span style="background:#f00;color:#fff;padding:2px 6px;border-radius:10px;font-size:10px">VIDEO</span>':''}</div><div style="font-size:11px;color:#FFD700">${p.time} • ${p.likes} likes • ${p.comments.length} comments</div></div></div><button class="btn-danger" onclick="deletePost(${p.id})">🗑️ Futa</button></div>${p.text?`<div style="padding:0 14px 14px">${p.text}</div>`:''}${mediaHtml}<div class="post-actions"><button class="btn-outline" onclick="likePost(${p.id})">❤️ Like (${p.likes})</button><button class="btn-outline" onclick="toggleComment(${p.id})">💬 Comment (${p.comments.length})</button><button class="btn-outline" style="border-color:#FFD700;color:#FFD700" onclick="openSendModal(${p.id})">📤 Tuma kwa Mtu</button><button class="btn-outline" style="border-color:#00FF88;color:#00FF88" onclick="shareWhatsApp(${p.id})">💬 WhatsApp</button></div><div class="comment-box" id="commentBox-${p.id}" style="display:none">${ch||'<div style="color:#666;font-size:12px">Hakuna comment</div>'}<div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="commentInput-${p.id}" placeholder="Andika comment..."><button class="btn-gold" onclick="addComment(${p.id})">Tuma</button></div></div></div>`;});}document.getElementById('postsContainer').innerHTML=h;}
function updateStats(){document.getElementById('postCount').textContent=posts.length;document.getElementById('videoCount').textContent=posts.filter(p=>p.mediaType=='video').length;document.getElementById('countText').textContent=posts.length+' Posts';document.getElementById('storageText').textContent=posts.length+' / 1000+ Posts';document.getElementById('storageFill').style.width=Math.min(100,(posts.length/1000*100))+'%';}
async function likePost(id){let p=posts.find(x=>x.id==id);if(p){p.likes++;await dbSave(p);renderPosts();}}
function toggleComment(id){let el=document.getElementById('commentBox-'+id);el.style.display=el.style.display=='none'?'block':'none';}
async function addComment(id){let i=document.getElementById('commentInput-'+id);let t=i.value.trim();if(!t)return;let p=posts.find(x=>x.id==id);if(p){p.comments.push({name:"Paul 92KG",text:t});await dbSave(p);renderPosts();document.getElementById('commentBox-'+id).style.display='block';}}
async function deleteComment(pid,idx){let p=posts.find(x=>x.id==pid);if(p){p.comments.splice(idx,1);await dbSave(p);renderPosts();document.getElementById('commentBox-'+pid).style.display='block';}}
async function deletePost(id){if(!confirm('Futa post hii?'))return;posts=posts.filter(x=>x.id!=id);await dbDelete(id);renderPosts();updateStats();}
let currentSendPost=null;function openSendModal(id){currentSendPost=posts.find(x=>x.id==id);document.getElementById('sendModal').style.display='flex';renderContacts(myContacts);}
function closeSendModal(){document.getElementById('sendModal').style.display='none';currentSendPost=null;}
function renderContacts(list){let h="";list.forEach(n=>{h+=`<div class="contact-item" onclick="selectContact('${n}')"><div class="avatar" style="width:32px;height:32px;font-size:12px">${n.charAt(0)}</div><span>${n}</span></div>`;});document.getElementById('contactList').innerHTML=h;}
function filterContacts(){let q=document.getElementById('searchContact').value.toLowerCase();renderContacts(myContacts.filter(n=>n.toLowerCase().includes(q)));}
function selectContact(name){document.getElementById('customName').value=name;}
function sendToWhatsApp(){if(!currentSendPost)return;let name=document.getElementById('customName').value.trim()||"Rafiki";if(!myContacts.includes(name)){myContacts.push(name);localStorage.setItem('must92kg_contacts_v5',JSON.stringify(myContacts));}let text=`🔥 MUST 92KG ULTIMATE - Kutoka kwa Paul%0A%0A${encodeURIComponent(currentSendPost.text)}%0AApp: https://paul-gram200.github.io/Paul-app/%0AImetumwa kwa: ${name}`;window.open('https://wa.me/?text='+text,'_blank');closeSendModal();}
function shareWhatsApp(id){let p=posts.find(x=>x.id==id);let text=`${p.text} - MUST 92KG App https://paul-gram200.github.io/Paul-app/`;window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');}
(async()=>{await initDB();posts=await dbGetAll();posts.sort((a,b)=>b.id-a.id);renderPosts();updateStats();})();
</script>
</body>
</html>
